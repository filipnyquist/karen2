services:
  postgres:
    image: postgres:16-alpine
    container_name: karen2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-karen2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-karen2}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karen2} -d ${DB_NAME:-karen2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karen2-network

  redis:
    image: redis:7-alpine
    container_name: karen2-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karen2-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-deps
    container_name: karen2-migrations
    restart: "no"
    command: ["bun", "run", "db:migrate"]
    working_dir: /app/packages/backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-karen2}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-karen2}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - karen2-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: karen2-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-karen2}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-karen2}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@karen2.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:80/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - karen2-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  karen2-network:
    driver: bridge
